<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Portal</title>



    <link rel="stylesheet" href="styles.css">

</head>

<body>



    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="logo-circle">C</div>

            <h2>Campus Portal</h2>

        </div>

    </header>



    <!-- NAVIGATION BAR -->

    <nav class="navbar">

        <a href="#">HOME</a>

        <a href="#">ABOUT</a>

        <a href="#">CONTACT US</a>

    </nav>



    <!-- MAIN CONTENT -->

    <main class="container">



        <!-- CAMPUS NOTICE -->

        <section class="campus-notice">



            <h2>Campus Notice</h2>



            <div class="image-container">



                <div class="image-box">

                    <img

                        src="https://placehold.co/300x200?text=Image+1"

                        alt="Campus Notice Image 1">

                </div>



                <div class="image-box">

                    <img

                        src="https://placehold.co/300x200?text=Image+2"

                        alt="Campus Notice Image 2">

                </div>



                <div class="image-box">

                    <img

                        src="https://placehold.co/300x200?text=Image+3"

                        alt="Campus Notice Image 3">

                </div>



            </div>



        </section>



        <!-- CONTENT FORM -->

        <section class="content">



            <h2>Content</h2>



            <form>



                <label for="title">Title:</label>



                <input

                    type="text"

                    id="title"

                    name="title"

                    placeholder="Enter title"

                    required

                >



                <label for="message">Message:</label>



                <textarea

                    id="message"

                    name="message"

                    placeholder="Write your message here..."

                    required

                ></textarea>



                <button type="button">Post Notice</button>



            </form>



        </section>



    </main>



    <!-- FOOTER -->

    <footer class="footer">



        <h2>College of Computer Studies</h2>



        <p>Campus Portal | All Rights Reserved</p>



    </footer>



</body>

</html>
